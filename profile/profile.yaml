summary: "I am a Computer Science graduate from Wilfrid Laurier University with experience building full-stack applications and end-to-end data pipelines. At Cardata, I built backend services and APIs in Laravel and Node.js to handle reimbursement calculations and financial workflows, while contributing to the frontend with React.js and TypeScript, where I improved the architecture and built reusable components to make the application faster and easier to build on. Previously at Lowe-Martin, I automated data sanitization processes using Python and VBA, improving shipping accuracy and reducing manual effort through efficient batch processing. What excites and makes me passionate about the software industry is that there is always something new to learn or a better way to build something. I genuinely enjoy that process, whether it is picking up a new technology or finding a cleaner solution to a problem I have already solved."
