apiVersion: v2
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres         
  replicas: 1                 
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres           
    spec:
      containers:
        - name: postgres
          image: postgres:16    
          ports:
            - containerPort: 5432
          env:                 
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "host_agent"   
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata" 
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data      
  volumeClaimTemplates:        
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi        